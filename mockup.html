<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cube Timer UI</title>

<style>
:root {
  --bg: #0e0e0f;
  --panel: #1a1a1c;
  --panel-soft: rgba(255,255,255,0.05);
  --text: #f2f2f2;
  --muted: #9a9a9a;
  --yellow: #f0c400;
  --red: #e14b4b;
  --border: rgba(255,255,255,0.08);
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 50% 40%, #1c1c1f 0%, #0e0e0f 60%);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 100%;
  max-width: 1200px;
  padding: 24px 32px 40px;
}

/* ───────── Header ───────── */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 48px;
}

.cube-select {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 14px;
}

.cube-icon {
  width: 18px;
  height: 18px;
  background: linear-gradient(135deg, #fff, #aaa);
  border-radius: 3px;
}

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #444, #777);
}

/* ───────── Scramble ───────── */

.scramble-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 56px;
}

.arrow {
  font-size: 20px;
  opacity: 0.6;
}

.scramble {
  flex: 1;
  text-align: center;
  font-size: 18px;
  letter-spacing: 1.5px;
  color: #e6e6e6;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.refresh {
  font-size: 18px;
  opacity: 0.6;
}

/* ───────── Timer ───────── */

.timer {
  text-align: center;
  font-size: 140px;
  font-weight: 500;
  letter-spacing: 2px;
  margin-bottom: 24px;
}

/* ───────── Controls ───────── */

.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 56px;
}

.btn {
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
}

.btn-yellow {
  border-color: var(--yellow);
  color: var(--yellow);
}

.btn-red {
  border-color: var(--red);
  color: var(--red);
}

.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ───────── Stats ───────── */

.stats {
  display: flex;
  justify-content: center;
  gap: 24px;
}

.card {
  width: 220px;
  padding: 22px 20px;
  border-radius: 14px;
  background: var(--panel-soft);
  border: 1px solid var(--border);
  text-align: center;
  backdrop-filter: blur(6px);
}

.card-label {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 6px;
}

.card-value {
  font-size: 42px;
  font-weight: 500;
}

/* ───────── Responsive ───────── */

@media (max-width: 768px) {
  .timer {
    font-size: 88px;
  }
  .stats {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>

<body>
  <div class="app">

    <!-- Header -->
    <div class="header">
      <div class="cube-select">
        <div class="cube-icon"></div>
        <span>3x3x3 Cube</span>
      </div>
      <div class="avatar"></div>
    </div>

    <!-- Scramble -->
    <div class="scramble-row">
      <div class="arrow">‹</div>
      <div class="scramble">
        D2 B2 L2 F D2 R2 U2 B' R2 U' B R D2 F' L B F' L' R' D
      </div>
      <div class="refresh">⟳</div>
    </div>

    <!-- Timer -->
    <div class="timer">15.42</div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-yellow">+2</button>
      <button class="btn btn-red">DNF</button>
      <button class="btn btn-icon">🗑</button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="card">
        <div class="card-label">Ao5</div>
        <div class="card-value">16.12</div>
      </div>
      <div class="card">
        <div class="card-label">Ao12</div>
        <div class="card-value">17.05</div>
      </div>
    </div>

  </div>
</body>
</html>
